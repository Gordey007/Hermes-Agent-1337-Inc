[project]
name = "hermes_nvidia_stripe"
version = "0.1.0"
description = "Autonomous revenue agent: X/Twitter leads -> multi-agent build -> Stripe sale -> MinIO delivery."
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "python-dotenv>=1.2.2",
    "httpx",
    "anyio>=4.0.0",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "pyyaml>=6.0",
    "trafilatura>=1.8",
    "beautifulsoup4>=4.12",
    "stripe>=9.0",
    "minio>=7.2",
]

[project.optional-dependencies]
dspy = ["dspy-ai>=2.5"]